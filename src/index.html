<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual de Cupcakes Gourmet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🧁 Cupcake Gourmet Store</h1>
        <nav>
            <a href="#produtos">Produtos</a>
            <a href="#carrinho">Carrinho (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section id="produtos" class="product-grid">
            <!-- Produtos renderizados via JS (View) -->
        </section>

        <section id="carrinho" class="cart-section">
            <h2>Seu Carrinho de Compras</h2>
            <ul id="cart-items"></ul>
            <p><strong>Total: R$ <span id="cart-total">0.00</span></strong></p>
            <button onclick="controller.finalizarPedido()">Finalizar Pedido</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
